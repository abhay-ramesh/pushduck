[project]
name = "pushduck"
version = "0.1.0"
description = "pushduck server for Python — direct-to-S3 uploads over the pushduck wire protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhay Ramesh" }]
keywords = ["s3", "upload", "presigned", "asgi", "fastapi", "django"]

# No runtime dependencies, deliberately. Signing is HMAC-SHA256 from hashlib,
# and the protocol is JSON over HTTP — pulling in boto3 for one signature would
# be larger than this entire package and would drag a dependency tree into
# every application that installs it.
dependencies = []

[project.urls]
Homepage = "https://pushduck.org"
Documentation = "https://pushduck.org/docs/protocol"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pushduck"]
