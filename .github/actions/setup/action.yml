name: "Setup Project"
description: "Setup Node.js, pnpm, and install dependencies"

inputs:
  node-version:
    description: "Node.js version to use"
    required: false
    # The default toolchain runs lint/build; rolldown 1.2+ needs
    # Promise.withResolvers (Node 22), and Node 20 is EOL since April 2026.
    # Runtime compatibility with 20 is still tested by the explicit matrix.
    default: "22"

runs:
  using: "composite"
  steps:
    - name: 📦 Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.18.3

    - name: 📦 Setup Node.js & pnpm
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: "pnpm"

    - name: 📥 Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
