name: 🔍 Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🧪 Quality Gates
  quality:
    name: 🛡️ Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A real S3-compatible server for the integration suite. Without it the
      # SigV4 signing path is only ever checked against our own expectations of
      # the algorithm — a self-consistently wrong signature passes every unit
      # test and fails in a user's bucket. The same script developers use
      # locally; a service container can't run the official minio/minio image
      # because services accept no command, and the Bitnami image that could
      # was withdrawn from Docker Hub.
      - name: 🪣 Start MinIO
        run: ./packages/pushduck/scripts/minio.sh start

      - name: 🏗️ Setup project
        uses: ./.github/actions/setup

      - name: 🔍 Lint
        run: pnpm lint

      - name: 🔷 TypeScript
        run: pnpm type-check

      # The Bun and Deno suites skip themselves when their binary is absent,
      # so without these the Elysia, Bun.serve, Deno.serve and Fresh coverage
      # would silently vanish from CI while still reporting green.
      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 🦕 Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: 🧪 Tests
        run: pnpm test:coverage
        env:
          # The integration suite skips itself when this is unreachable, so a
          # MinIO outage degrades coverage rather than breaking the build.
          MINIO_ENDPOINT: http://127.0.0.1:9010

      - name: 📊 Coverage Report
        uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/pushduck/coverage/lcov.info

  # 🏗️ Build & Bundle Analysis
  build:
    name: 🏗️ Build & Bundle Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🏗️ Setup project
        uses: ./.github/actions/setup

      - name: 🏗️ Build packages
        run: pnpm build:packages

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            packages/*/build
          retention-days: 1

      - name: 📊 Bundle size analysis
        run: |
          cd packages/pushduck
          pnpm build:analyze

      - name: 📈 Bundle size report
        if: github.event_name == 'pull_request'
        run: |
          echo "## 📦 Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          cd packages/pushduck
          pnpm size-check

  # 🔐 Security Audit
  security:
    name: 🔐 Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🏗️ Setup project
        uses: ./.github/actions/setup

      - name: 🔐 Audit dependencies (pushduck package only)
        run: |
          # Run full audit (monorepo uses single lockfile) but only fail if pushduck's tree has high/critical vulns
          AUDIT_JSON=$(pnpm audit --audit-level high --prod --json 2>/dev/null || true)
          PUSHDUCK_VULNS=$(echo "$AUDIT_JSON" | jq -r '[.advisories // {} | to_entries[] | .value.findings[]?.paths[]? | select(startswith("pushduck>"))] | .[]' 2>/dev/null || true)
          if [ -n "$PUSHDUCK_VULNS" ]; then
            echo "::error::Security: pushduck package has high/critical production vulnerabilities"
            echo "$PUSHDUCK_VULNS"
            exit 1
          fi
          echo "Pushduck package: no high/critical production vulnerabilities."

  # 🎯 Matrix Testing (multiple Node versions) - Optimized
  compatibility:
    name: 🎯 Node.js ${{ matrix.node }} Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    strategy:
      matrix:
        # 18 is EOL (April 2025) and vitest 8 needs util.styleText, which
        # arrived in Node 20.12 — the suite cannot start on 18. The library's
        # engines claim is unchanged; this is a toolchain floor, not a
        # runtime one.
        node: ["20", "22"]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🏗️ Setup project
        uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: 📦 Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-artifacts

      - name: 🧪 Test with Node.js ${{ matrix.node }}
        run: pnpm test

  # 🐹 The Go server
  #
  # The conformance suite is language-neutral and the TypeScript package's
  # cross-language suite drives the real upload client against this server, but
  # both skip themselves when no Go server is listening — and the quality job
  # has none. Without this job the Go implementation is only ever checked on a
  # contributor's machine. Runs alongside quality rather than after it: it
  # shares nothing with the TypeScript build.
  go:
    name: 🐹 Go Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🪣 Start MinIO
        run: ./packages/pushduck/scripts/minio.sh start

      # go.mod's `go` line is the floor the module claims, so that is what is
      # tested. No go.sum — the module has no dependencies — so nothing to cache.
      - name: 🐹 Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: packages/pushduck-go/go.mod
          cache: false

      # Node is for the conformance runner and the JavaScript client, which
      # are the two things that judge this server from outside it.
      - name: 🏗️ Setup project
        uses: ./.github/actions/setup

      - name: 🔍 Vet
        working-directory: packages/pushduck-go
        run: go vet ./...

      - name: 🧪 Tests
        working-directory: packages/pushduck-go
        run: go test ./...
        env:
          MINIO_ENDPOINT: http://127.0.0.1:9010

      - name: 📐 Conformance
        run: |
          (cd packages/pushduck-go && go build -o "$RUNNER_TEMP/conformance-server" ./cmd/conformance-server)
          "$RUNNER_TEMP/conformance-server" &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4320/api/upload
          pnpm conformance --url http://localhost:4320/api/upload

      # cross-language.test.ts skips when the server is unreachable, which
      # would let this step pass having run nothing. Here the server is ours
      # to provide, so every case must have run and passed.
      - name: 🌉 JavaScript client against the Go server
        run: |
          (cd packages/pushduck-go && go build -o "$RUNNER_TEMP/minio-server" ./cmd/minio-server)
          "$RUNNER_TEMP/minio-server" &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4321/api/upload
          cd packages/pushduck
          pnpm exec vitest run src/__tests__/cross-language.test.ts --project unit \
            --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/cross-language.json"
          jq -e '.numTotalTests > 0 and .numPassedTests == .numTotalTests' "$RUNNER_TEMP/cross-language.json" >/dev/null \
            || { echo "::error::cross-language suite skipped cases with the Go server running"; exit 1; }
        env:
          MINIO_ENDPOINT: http://127.0.0.1:9010

  # 🐍 The Python server
  #
  # Tested at both ends of `requires-python`: the floor is the compatibility
  # promise, the newest release is what a new project installs.
  python:
    name: 🐍 Python ${{ matrix.python }} Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.14"]

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 🪣 Start MinIO
        run: ./packages/pushduck/scripts/minio.sh start

      # uv rather than actions/setup-python: the latter has no 3.9 build for
      # the current ubuntu-latest image, and testing the floor is the point of
      # the 3.9 leg. uv's standalone builds still cover it.
      - name: 🐍 Setup Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          activate-environment: true

      # The `test` dependency group includes every framework test_frameworks.py
      # mounts into; each skips when absent, so installing them is what makes
      # those tests run rather than vanish.
      - name: 📥 Install test dependencies
        working-directory: packages/pushduck-py
        run: uv pip install --group test

      - name: 🧪 Tests
        working-directory: packages/pushduck-py
        run: python -m pytest -rs
        env:
          MINIO_ENDPOINT: http://127.0.0.1:9010

      - name: 🏗️ Setup project
        uses: ./.github/actions/setup

      - name: 📐 Conformance
        run: |
          python packages/pushduck-py/cmd/conformance_server.py &
          curl -sf --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null http://localhost:4322/api/upload
          pnpm conformance --url http://localhost:4322/api/upload

  # ✅ All checks passed
  all-checks:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [quality, build, security, compatibility, go, python]
    if: always()

    steps:
      - name: ✅ Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        run: echo "All checks passed! 🎉"

      - name: ❌ Failure
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "Some checks failed. Please review the logs above."
          exit 1
